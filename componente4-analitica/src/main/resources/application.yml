server:
  port: 8084
  servlet:
    context-path: /api

spring:
  application:
    name: componente4-analitica

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/cine_analytics_dw
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        auto-startup: true
        acknowledge-mode: auto

# Integración con RabbitMQ
app:
  rabbitmq:
    exchange: payment.exchange
    queue: payment.completed.queue
    routing-key: payment.completed

# URLs de comunicación síncrona con otros microservicios (o enrutamiento vía Gateway)
services:
  cartelera:
    url: ${CARTELERA_SERVICE_URL:http://localhost:8081/api/v1}
  usuarios:
    url: ${USUARIOS_SERVICE_URL:http://localhost:8083/api/v1}
  gateway:
    url: ${GATEWAY_SERVICE_URL:http://localhost:8080}

# Registro en Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

