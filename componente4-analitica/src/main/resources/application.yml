server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: /api

spring:
  application:
    name: componente4-analitica

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/cine_analytics_dw
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # RABBITMQ_USER es el nombre que usan los Componentes 2 y 3;
    # se mantiene RABBITMQ_USERNAME como alternativa por compatibilidad.
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        auto-startup: true
        acknowledge-mode: auto

  # --- OpenFeign: timeouts de las llamadas síncronas (C1, C2 y C3) ---
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:5000}
            logger-level: basic

  # Validación de los JWT emitidos por el Componente 3 (IAM)
  security:
    oauth2:
      resourceserver:
        jwt:
          # La clave pública se descarga por la red de Docker
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8083/v1/iam/.well-known/jwks.json}
          # Debe coincidir con el claim "iss" que firma el Comp. 3
          issuer-uri: ${JWT_ISSUER:http://localhost:8083/v1/iam}

# Integración con RabbitMQ
app:
  rabbitmq:
    exchange: payment.exchange
    queue: payment.completed.queue
    routing-key: payment.completed
  analytics:
    # Zona horaria con la que se interpretan las horas de sesión que devuelve
    # Reservas (Instant en UTC) para filtrar por día de la semana y franja.
    # Debe coincidir con CATALOG_TIME_ZONE del Componente 2.
    time-zone: ${ANALYTICS_TIME_ZONE:Europe/Madrid}

# URLs de comunicación síncrona con otros microservicios (o enrutamiento vía Gateway)
services:
  cartelera:
    url: ${CARTELERA_SERVICE_URL:http://localhost:8081/api/v1}
  reservas:
    # El context-path del Comp. 2 es /v1 (no /api/v1)
    url: ${RESERVAS_SERVICE_URL:http://localhost:8082/v1}
  usuarios:
    # El context-path del Comp. 3 es /v1/iam (no /api/v1)
    url: ${USUARIOS_SERVICE_URL:http://localhost:8083/v1/iam}
  gateway:
    url: ${GATEWAY_SERVICE_URL:http://localhost:8080}

# Registro en Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
