server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: componente5-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: media-posters
              uri: ${MEDIA_URI:http://media-server:80}
              predicates:
                - Path=/media/**
            - id: componente1-cartelera
              uri: ${COMPONENTE1_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/cinemas/**,/api/v1/movies/**,/api/v1/rooms/**,/api/v1/sessions/**
            - id: componente2-reservas
              uri: ${COMPONENTE2_URI:http://localhost:8082}
              predicates:
                - Path=/v1/reservations/**
            - id: componente3-usuarios
              uri: ${COMPONENTE3_URI:http://localhost:8083}
              predicates:
                - Path=/v1/iam/**
            - id: componente4-analitica
              uri: ${COMPONENTE4_URI:http://localhost:8084}
              predicates:
                - Path=/api/metrics/**,/api/reports/**,/api/recommendations/**

app:
  cors:
    allowed-origin: ${GATEWAY_CORS_ALLOWED_ORIGIN:http://localhost:3000}
  security:
    jwt:
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8083/v1/iam/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:http://localhost:8083/v1/iam}
