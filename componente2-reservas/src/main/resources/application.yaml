# =====================================================================
# Componente 2 - Reservas, Asientos y Pagos
# Todas las propiedades admiten variables de entorno (útil en Docker).
# =====================================================================
server:
  port: ${SERVER_PORT:8082}
  servlet:
    # URL base: http://localhost:8082/v1/reservations
    context-path: /v1

spring:
  application:
    name: componente2-reservas

  # --- PostgreSQL (base de datos propia: Database per Service) ---
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cine_reservas_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    # Sin Open Session In View: las consultas solo ocurren dentro de los servicios
    open-in-view: false
    hibernate:
      # Hibernate crea/actualiza las tablas al arrancar (igual que el Comp. 3).
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          # Todas las fechas se guardan normalizadas en UTC
          time_zone: UTC

  # --- RabbitMQ (bus de eventos compartido con los Comp. 3 y 4) ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Publisher confirms: el broker confirma cada mensaje antes de marcarlo como publicado
    publisher-confirm-type: simple

  # --- Seguridad: validación de los JWT emitidos por el Componente 3 ---
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clave pública RSA del Comp. 3. Se descarga la primera vez que llega un token.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8083/v1/iam/.well-known/jwks.json}
          # Debe coincidir con el claim "iss" que firma el Comp. 3
          issuer-uri: ${JWT_ISSUER:http://localhost:8083/v1/iam}

  # --- OpenFeign: timeouts de las llamadas síncronas ---
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:5000}
            logger-level: basic

app:
  clients:
    # Comp. 1 - Cartelera (context-path /api/v1)
    cartelera:
      url: ${CARTELERA_URL:http://localhost:8081/api/v1}
    # Comp. 3 - Usuarios (context-path /v1/iam)
    usuarios:
      url: ${USUARIOS_URL:http://localhost:8083/v1/iam}

  reservations:
    hold-ttl: ${RESERVATION_HOLD_TTL:10m}
    currency: EUR
    expiration-batch: 100
    expiration-sweep-interval: ${RESERVATION_SWEEP_INTERVAL:30s}
    catalog-time-zone: ${CATALOG_TIME_ZONE:UTC}
    # Margen en el que no se caduca una reserva mientras el cliente paga en la web de Redsys
    payment-grace: ${RESERVATION_PAYMENT_GRACE:15m}

  pricing:
    spectator-day: ${SPECTATOR_DAY:WEDNESDAY}
    spectator-day-discount: 0.20
    loyalty-points-threshold: ${LOYALTY_POINTS_THRESHOLD:500}
    loyalty-discount: 0.10
    time-zone: Europe/Madrid

  payment:
    # simulated (tests y modo aislado) | redsys (web de pruebas real de Redsys)
    mode: ${PAYMENT_MODE:simulated}
    redsys:
      # ==================================================================================
      # ATENCIÓN: DATOS GENÉRICOS DE PRUEBA DE REDSYS, NO SON CREDENCIALES REALES.
      #
      # El número de comercio, el terminal y la clave secreta de abajo son los "Datos
      # genéricos de prueba" que Redsys publica para TODOS los desarrolladores en su
      # "Manual de integración para conexión por Redirección" (v2.1, apartado de entorno
      # de pruebas):
      # https://canales.redsys.es/ayuda/documentacion/Manual%20integracion%20para%20conexion%20por%20Redireccion.pdf
      # Solo funcionan contra el entorno de PRUEBAS (sis-t.redsys.es) y no mueven dinero
      # real. Se dejan aquí para que el proyecto se pueda probar sin configurar nada.
      #
      # SI REUTILIZAS ESTE CÓDIGO CON UN COMERCIO REAL: NO escribas aquí tu clave.
      # Una clave real es un secreto: pásala SOLO por variables de entorno
      # (REDSYS_SECRET_KEY, REDSYS_MERCHANT_CODE, REDSYS_TERMINAL, REDSYS_PAYMENT_URL)
      # o un gestor de secretos, y nunca la subas al repositorio.
      # ==================================================================================
      payment-url: ${REDSYS_PAYMENT_URL:https://sis-t.redsys.es:25443/sis/realizarPago}
      merchant-code: ${REDSYS_MERCHANT_CODE:999008881}
      terminal: ${REDSYS_TERMINAL:1}
      secret-key: ${REDSYS_SECRET_KEY:sq7HjrUOBfKmC576ILgskD5srU870gJ7}
      currency: "978"   # euro (código ISO 4217 numérico)
      # A dónde vuelve el navegador del cliente desde Redsys. Por defecto, al endpoint de
      # retorno de este microservicio (valida la firma y confirma). Cuando el frontend
      # tenga su página de resultado, se apunta allí (por ejemplo http://localhost:3000/pago/resultado)
      url-ok: ${REDSYS_URL_OK:http://localhost:8082/v1/reservations/payments/redsys/return}
      url-ko: ${REDSYS_URL_KO:http://localhost:8082/v1/reservations/payments/redsys/return}
      # Notificación servidor a servidor: necesita una URL pública en internet (vacía = no se usa)
      merchant-url: ${REDSYS_MERCHANT_URL:}

  rabbitmq:
    exchange: ${PAYMENT_EXCHANGE:payment.exchange}
    payment-completed-routing-key: ${PAYMENT_COMPLETED_ROUTING_KEY:payment.completed}
    payment-refunded-routing-key: ${PAYMENT_REFUNDED_ROUTING_KEY:payment.refunded}
    confirm-timeout-ms: 5000

  outbox:
    relay-interval: ${OUTBOX_RELAY_INTERVAL:2s}
    batch-size: 50

logging:
  level:
    com.cinasee.componente2_reservas: INFO
