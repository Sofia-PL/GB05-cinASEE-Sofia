version: '3.8'

services:

# ==========================================
# INFRAESTRUCTURA COMPARTIDA / MENSAJERÍA
# ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

# ==========================================
# COMPONENTE 3: USUARIOS
# ==========================================

# ==========================================
# COMPONENTE 1: CARTELERA
# ==========================================
  # Contenedor 1: Base de datos aislada
  mongodb-cartelera:
    image: mongo:7.0
    container_name: mongodb-cartelera
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cine_catalog_db
    volumes:
      - mongo_data:/data/db

  # Contenedor 2: Microservicio Spring Boot
  componente1-cartelera:
    build:
      context: ./componente1-cartelera
    container_name: app-cartelera
    ports:
      - "8081:8081"
    depends_on:
      - mongodb-cartelera
    environment:
      # Sobrescribimos la URI para que apunte al nombre del contenedor de Mongo, no a localhost
      SPRING_DATA_MONGODB_URI: mongodb://mongodb-cartelera:27017/cine_catalog_db

# ==========================================
# COMPONENTE 2: RESERVAS
# ==========================================
  # Contenedor 1: Base de datos aislada (PostgreSQL propio, distinto del de Analítica)
  postgres-reservas:
    image: postgres:16-alpine
    container_name: postgres-reservas
    ports:
      - "5433:5432"   # 5432 suele estar ocupado por un PostgreSQL local; 5434 lo usa Analítica
    environment:
      POSTGRES_DB: cine_reservas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_reservas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cine_reservas_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Contenedor 2: Microservicio Spring Boot (Dockerfile multi-stage: compila dentro de la imagen)
  componente2-reservas:
    build:
      context: ./componente2-reservas
    container_name: app-reservas
    ports:
      - "8082:8082"
    depends_on:
      postgres-reservas:
        condition: service_healthy   # no arranca hasta que PostgreSQL acepta conexiones
      rabbitmq:
        condition: service_started
      componente1-cartelera:
        condition: service_started
    environment:
      # Base de datos propia (nombre del contenedor, puerto interno 5432)
      POSTGRES_HOST: postgres-reservas
      POSTGRES_PORT: 5432
      POSTGRES_DB: cine_reservas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Comunicación ASÍNCRONA: publica PaymentCompleted en payment.exchange (lo consumen Comp. 3 y 4)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      # Comunicación SÍNCRONA (OpenFeign) con Cartelera y Usuarios por la red de Docker
      CARTELERA_URL: http://componente1-cartelera:8081/api/v1
      USUARIOS_URL: http://componente3-usuarios:8083/v1/iam
      # Validación de los JWT del Comp. 3: la clave pública se descarga por la red de Docker,
      # pero el emisor ("iss") es el que el Comp. 3 escribe dentro del token.
      JWT_JWK_SET_URI: http://componente3-usuarios:8083/v1/iam/.well-known/jwks.json
      JWT_ISSUER: http://localhost:8083/v1/iam
      # Pasarela de pago simulada (no hay credenciales reales de Redsýs)
      PAYMENT_MODE: simulated

# ==========================================
# COMPONENTE 4: ANALÍTICA
# ==========================================
  # Contenedor 1: Base de datos aislada (PostgreSQL)
  postgres-analitica:
    image: postgres:16-alpine
    container_name: postgres-analitica
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: cine_analytics_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_analitica_data:/var/lib/postgresql/data

  # Contenedor 2: Microservicio Spring Boot
  componente4-analitica:
    build:
      context: ./componente4-analitica
    container_name: app-analitica
    ports:
      - "8084:8084"
    depends_on:
      - postgres-analitica
      - rabbitmq
    environment:
      # Configuración de base de datos apuntando al contenedor PostgreSQL
      DB_HOST: postgres-analitica
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-analitica:5432/cine_analytics_dw
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Configuración de RabbitMQ apuntando al broker
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      # URLs para comunicación con otros microservicios en la red de Docker
      CARTELERA_SERVICE_URL: http://componente1-cartelera:8081/api/v1
      USUARIOS_SERVICE_URL: http://componente3-usuarios:8083/api/v1

# ==========================================
# COMPONENTE 5: GATEWAY
# ==========================================


# ==========================================
volumes:
  mongo_data:
  postgres_reservas_data:
  postgres_analitica_data:
  rabbitmq_data:
