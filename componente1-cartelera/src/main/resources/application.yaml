server:
  port: ${SERVER_PORT:8081} # Servidor de desarrollo CineAsee
  servlet:
    context-path: /api/v1 # Ruta base de la API

spring:
  application:
    name: componente1-cartelera
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/cine_catalog_db}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clave pública RSA del Componente 3. Dentro de Docker se descarga por la
          # red interna (componente3-usuarios), no por localhost.
          # Si esta propiedad está presente, Spring NO hace discovery del issuer al
          # arrancar: evita que el contenedor se llame a sí mismo en localhost:8083.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8083/v1/iam/.well-known/jwks.json}
          # Debe coincidir con el claim "iss" que firma el Componente 3
          issuer-uri: ${JWT_ISSUER:http://localhost:8083/v1/iam}
