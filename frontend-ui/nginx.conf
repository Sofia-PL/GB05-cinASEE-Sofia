# Servidor de la web del frontend (SPA de React Router)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas del frontend (/compra, /pago/redsys/vuelta...): si no es un fichero,
    # se devuelve index.html y React Router muestra la página correspondiente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros compilados llevan hash en el nombre: se pueden cachear mucho tiempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
